# ESPHome - M5Stack ATOM ECHO (ESP32-PICO-D4, sem PSRAM, sem S3)
# Compatível com HA Satellite Assist via Voice Assistant Pipeline
#
# Hardware:
#   MCU  : ESP32-PICO-D4 (4 MB flash, 520 KB SRAM, sem PSRAM)
#   Mic  : SPM1423 (PDM)  CLK=GPIO19  DATA=GPIO23  WS=GPIO33
#   Spkr : NS4168  (I2S)  BCLK=GPIO19 LRCLK=GPIO33 DIN=GPIO22
#   LED  : WS2812B 1x     GPIO27
#   Botão: GPIO39 (ativo em nível baixo)
#
# Wake word:
#   On-device (microWakeWord) requer PSRAM — não disponível neste modelo.
#   Use o switch "Wake Word" para ativar detecção via openWakeWord no HA
#   (servidor), ou pressione o botão para modo push-to-talk.

esphome:
  name: atom-echo
  friendly_name: ATOM Echo
  min_version: "2024.6.0"
  on_boot:
    priority: 600
    then:
      - script.execute: boot_led

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - script.execute: reset_led
  on_client_disconnected:
    - voice_assistant.stop:
    - light.turn_on:
        id: led
        red: 100%
        green: 50%
        blue: 0%
        brightness: 60%
        effect: pulse

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Atom-Echo Fallback"
    password: !secret fallback_password
  on_connect:
    - script.execute: reset_led
  on_disconnect:
    - light.turn_on:
        id: led
        red: 100%
        green: 50%
        blue: 0%
        brightness: 60%
        effect: pulse

captive_portal:

# ── Áudio ────────────────────────────────────────────────────────────────────
# Barramento I2S único; BCLK e LRCLK são compartilhados entre mic e speaker.
i2s_audio:
  - id: i2s_audio
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio
    id: mic_in
    adc_type: external
    i2s_din_pin: GPIO23
    pdm: true

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio
    id: spkr_out
    dac_type: external
    i2s_dout_pin: GPIO22
    mode: mono

# ── Voice Assistant ───────────────────────────────────────────────────────────
# use_wake_word: false → wake word processado no HA (openWakeWord)
# Para ativar wake word contínuo, ligue o switch "Wake Word" no HA.
voice_assistant:
  microphone: mic_in
  speaker: spkr_out
  id: va
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  use_wake_word: false

  on_listening:
    - light.turn_on:
        id: led
        red: 0%
        green: 0%
        blue: 100%
        brightness: 100%
        effect: pulse

  on_stt_vad_end:
    - light.turn_on:
        id: led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 100%
        effect: pulse

  on_tts_stream_start:
    - light.turn_on:
        id: led
        red: 0%
        green: 100%
        blue: 0%
        brightness: 60%
        effect: none

  on_tts_stream_end:
    - script.execute: reset_led

  on_end:
    - delay: 100ms
    - wait_until:
        not:
          voice_assistant.is_running:
    - script.execute: reset_led

  on_error:
    - light.turn_on:
        id: led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 100%
        effect: none
    - delay: 1s
    - script.execute: reset_led

  on_client_connected:
    - if:
        condition:
          switch.is_on: wake_word_sw
        then:
          - voice_assistant.start_continuous:
    - script.execute: reset_led

  on_client_disconnected:
    - voice_assistant.stop:

# ── LED ───────────────────────────────────────────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: LED
    pin: GPIO27
    num_leds: 1
    rmt_channel: 0
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 0ms
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: pulse
          transition_length: 300ms
          update_interval: 300ms
          min_brightness: 5%
          max_brightness: 80%

# ── Botão ─────────────────────────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: btn
    name: Botão
    filters:
      - delayed_on: 10ms
    on_press:
      - if:
          condition:
            switch.is_off: wake_word_sw
          then:
            - voice_assistant.start:
    on_release:
      - if:
          condition:
            switch.is_off: wake_word_sw
          then:
            - voice_assistant.stop:

# ── Switch: Wake Word (servidor) ──────────────────────────────────────────────
# OFF → push-to-talk via botão físico
# ON  → streaming contínuo; HA detecta wake word via openWakeWord
switch:
  - platform: template
    name: Wake Word
    id: wake_word_sw
    icon: mdi:microphone-message
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            api.connected:
          then:
            - voice_assistant.start_continuous:
    on_turn_off:
      - voice_assistant.stop:
      - script.execute: reset_led

# ── Scripts de LED ────────────────────────────────────────────────────────────
script:
  - id: reset_led
    mode: restart
    then:
      - light.turn_on:
          id: led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 8%
          effect: none

  - id: boot_led
    then:
      - light.turn_on:
          id: led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 50%
          effect: none
      - delay: 400ms
      - light.turn_on:
          id: led
          red: 0%
          green: 100%
          blue: 0%
          brightness: 50%
          effect: none
      - delay: 400ms
      - light.turn_off:
          id: led
